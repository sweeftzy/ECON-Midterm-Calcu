<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECON Midterm Calc</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 25px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }

    label {
      display: flex;
      flex-direction: column;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .results {
      margin-top: 30px;
      background: #f9fafb;
      padding: 20px;
      border-radius: 10px;
    }

    .results p {
      margin: 10px 0;
      font-size: 16px;
    }

    .final {
      font-size: 22px;
      font-weight: bold;
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ECON Midterm Calc</h1>

    <h2>Quiz (QZ)</h2>
    <div class="grid">
      <label>QZ1
        <input type="number" id="qz1" value="0" />
      </label>
      <label>QZ2
        <input type="number" id="qz2" value="0" />
      </label>
      <label>QZ3
        <input type="number" id="qz3" value="0" />
      </label>
    </div>

    <h2>Seatwork (SW)</h2>
    <div class="grid">
      <label>SW1
        <input type="number" id="sw1" value="0" />
      </label>
      <label>SW2
        <input type="number" id="sw2" value="0" />
      </label>
      <label>SW3
        <input type="number" id="sw3" value="0" />
      </label>
      <label>SW4
        <input type="number" id="sw4" value="0" />
      </label>
    </div>

    <h2>Plates (PL)</h2>
    <div class="grid">
      <label>PL1
        <input type="number" id="pl1" value="0" />
      </label>
      <label>PL2
        <input type="number" id="pl2" value="0" />
      </label>
    </div>

    <h2>Exam</h2>
    <div class="grid">
      <label>Points
        <input type="number" id="points" value="0" />
      </label>
    </div>

    <button onclick="calculate()">Calculate Midterm Grade</button>

    <div class="results">
      <p><strong>Quiz Score (QZ):</strong> <span id="qzResult">0</span></p>
      <p><strong>Seatwork Score (SW):</strong> <span id="swResult">0</span></p>
      <p><strong>Plates Score (PL):</strong> <span id="plResult">0</span></p>
      <p><strong>Attendance:</strong> 100</p>
      <p><strong>Clqzs Standing (CS):</strong> <span id="csResult">0</span></p>
      <p><strong>Exam Score:</strong> <span id="exResult">0</span></p>
      <p class="final">Midterm Grade: <span id="mtResult">0</span></p>
    </div>
  </div>

  <script>
    function calculate() {
      // Assignment inputs
      const QZ1 = parseFloat(document.getElementById('qz1').value) || 0;
      const QZ2 = parseFloat(document.getElementById('qz2').value) || 0;
      const QZ3 = parseFloat(document.getElementById('qz3').value) || 0;

      // Seatwork inputs
      const SW1 = parseFloat(document.getElementById('sw1').value) || 0;
      const SW2 = parseFloat(document.getElementById('sw2').value) || 0;
      const SW3 = parseFloat(document.getElementById('sw3').value) || 0;
      const SW4 = parseFloat(document.getElementById('sw4').value) || 0;

      // Plates inputs
      const PL1 = parseFloat(document.getElementById('pl1').value) || 0;
      const PL2 = parseFloat(document.getElementById('pl2').value) || 0;

      // Exam points
      const P = parseFloat(document.getElementById('points').value) || 0;

      // Attendance
      const AT = 10;

      // Formulqz
      const QZ = ((50) / 3) * (((QZ1 / 25) + (QZ2 / 60) + (QZ3 / 60)) + 3);

      const SW = ((50) / 4) * (((SW1 / 15) + (SW2 / 10) + (SW3 / 15) + (SW4 / 15)) + 4);

      const PL = ((50) / 2) * (((PL1 / 40) + (PL2 / 50)) + 2);

      const CS = (0.4 * QZ)  + (0.3 * SW) + (0.2 * PL) + AT;

      const EX = ((P / 50) * 50) + 50;

      const MT = (((3 * CS) + (2 * EX)) / 5);

      // Display results
      document.getElementById('qzResult').textContent = QZ.toFixed(2);
      document.getElementById('swResult').textContent = SW.toFixed(2);
      document.getElementById('plResult').textContent = PL.toFixed(2);
      document.getElementById('csResult').textContent = CS.toFixed(2);
      document.getElementById('exResult').textContent = EX.toFixed(2);
      document.getElementById('mtResult').textContent = MT.toFixed(2);
    }
  </script>
</body>
</html>
